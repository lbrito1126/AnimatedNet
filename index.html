<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>eyes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04050a; overflow:hidden;
    cursor:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 75% 65% at 50% 50%, #0a0d16 0%, #04050a 72%); }
  canvas { width:100%; height:100%; image-rendering:pixelated; }
  #label { position:fixed; left:50%; bottom:5%; transform:translateX(-50%);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:2.4vh; letter-spacing:.35em;
    color:rgba(180,205,255,0); text-transform:uppercase; transition:color .25s; pointer-events:none;
    text-shadow:0 0 12px rgba(120,160,255,.6); }
  #label.show { color:rgba(180,205,255,.75); }
  /* hidden settings tab: invisible hotspot in the top-right corner */
  #settingshit { position:fixed; right:0; top:0; width:16vw; height:14vh; z-index:6; }
  #panel { position:fixed; top:2.2vh; right:2.2vw; z-index:7; width:min(88vw,340px);
    --accent:#9fc0ff;
    padding:16px 18px 18px; border:1px solid rgba(120,160,255,.35);
    background:rgba(6,9,16,.85); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    border-radius:14px; box-shadow:0 12px 50px rgba(0,0,0,.62);
    font-family:ui-monospace,Menlo,Consolas,monospace; color:#bcd2ff;
    max-height:92vh; overflow-y:auto;
    transform-origin:top right; transition:opacity .18s ease, transform .18s ease; }
  #panel.hidden { opacity:0; transform:scale(.92) translateY(-6px); pointer-events:none; }
  #panel .phead { display:flex; justify-content:space-between; align-items:center;
    font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:#8fb0ff;
    padding-bottom:11px; margin-bottom:9px; border-bottom:1px solid rgba(120,160,255,.18); }
  #panel .phead button { background:none; border:none; color:#8fb0ff; font-size:22px; cursor:pointer; line-height:1; padding:0 4px; }
  #panel .row { display:flex; align-items:center; gap:11px; margin:10px 0; }
  #panel .lab { flex:0 0 66px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#7f9ad0; }
  #panel .lab i { display:block; font-style:normal; font-size:10px; color:#5f7093; letter-spacing:.04em; margin-top:2px; }
  #panel .sec { margin:13px 0 3px; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:#6f8bc0;
    border-top:1px solid rgba(120,160,255,.14); padding-top:11px; }
  #panel .segs { display:flex; flex-wrap:wrap; gap:7px; flex:1; }
  #panel .seg { flex:1 1 auto; min-width:48px; padding:8px 9px; font:inherit; font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; color:#9fb6e6; cursor:pointer;
    background:rgba(30,44,74,.5); border:1px solid rgba(120,160,255,.22); border-radius:8px;
    transition:background .15s, color .15s, border-color .15s; }
  #panel .seg.wide { flex:1 1 100%; }
  #panel .seg:hover { border-color:rgba(150,185,255,.55); }
  #panel .seg.on { background:var(--accent); color:#04070f; border-color:rgba(255,255,255,.55);
    box-shadow:0 0 15px rgba(150,185,255,.45); }
  #panel .seg.dis { opacity:.38; pointer-events:none; }
  #panel input[type=range]{ flex:1; accent-color:var(--accent); height:22px; background:transparent; cursor:pointer; }
  #panel input[type=color]{ flex:1; height:32px; padding:0; border:1px solid rgba(120,160,255,.3);
    border-radius:8px; background:transparent; cursor:pointer; }
  #panel .val { flex:0 0 38px; text-align:right; font-size:11px; color:#8fa8d8; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="label"></div>
<div id="settingshit"></div>
<div id="panel" class="hidden">
  <div class="phead"><span>settings</span><button id="closebtn" aria-label="close">&times;</button></div>
  <div class="row"><span class="lab">mode</span>
    <div class="segs">
      <button class="seg" data-mode="eyes">eyes</button>
      <button class="seg" data-mode="robo">robo</button>
      <button class="seg" data-mode="sigil">sigil</button>
      <button class="seg" data-mode="cat">cat</button>
    </div></div>
  <div class="row" id="moodrow"><span class="lab">mood</span>
    <div class="segs">
      <button class="seg" data-mood="0">focus</button>
      <button class="seg" data-mood="1">vigilant</button>
      <button class="seg" data-mood="2">wide</button>
      <button class="seg" data-mood="3">scan</button>
      <button class="seg" data-mood="4">chill</button>
    </div></div>
  <div class="row" id="roborow"><span class="lab">robo</span>
    <div class="segs">
      <button class="seg" data-robo="0">default</button>
      <button class="seg" data-robo="1">happy</button>
      <button class="seg" data-robo="2">tired</button>
      <button class="seg" data-robo="3">angry</button>
      <button class="seg" data-robo="4">curious</button>
    </div></div>
  <div class="row" id="catrow"><span class="lab">cat</span>
    <div class="segs">
      <button class="seg" data-cat="0">sleep</button>
      <button class="seg" data-cat="1">loaf</button>
      <button class="seg" data-cat="2">sit</button>
      <button class="seg" data-cat="3">side</button>
      <button class="seg" data-cat="4">stretch</button>
      <button class="seg" data-cat="5">play</button>
    </div></div>
  <div class="row"><span class="lab">smooth<i>older phones</i></span>
    <div class="segs"><button class="seg" id="perf">OFF</button></div></div>
  <div class="row" id="blinkrow"><div class="segs"><button class="seg wide" id="blinkbtn">blink</button></div></div>
  <div class="sec">adjust &middot; works in smooth mode too</div>
  <div class="row"><span class="lab">bright</span><input type="range" id="s_bright" min="0.2" max="4" step="0.05"><span class="val" id="v_bright">1.00</span></div>
  <div class="row"><span class="lab">glow</span><input type="range" id="s_glow" min="0" max="4" step="0.05"><span class="val" id="v_glow">1.00</span></div>
  <div class="row"><span class="lab">feather<i>glow spread</i></span><input type="range" id="s_feather" min="0" max="3" step="0.05"><span class="val" id="v_feather">1.00</span></div>
  <div class="row"><span class="lab">contrast</span><input type="range" id="s_contrast" min="0.3" max="3" step="0.05"><span class="val" id="v_contrast">1.00</span></div>
  <div class="row"><span class="lab">speed</span><input type="range" id="s_speed" min="0.1" max="4" step="0.05"><span class="val" id="v_speed">1.00</span></div>
  <div class="row"><span class="lab">bg<i>0 = black</i></span><input type="range" id="s_bg" min="0" max="3" step="0.05"><span class="val" id="v_bg">1.00</span></div>
  <div class="row"><span class="lab">zoom<i>on-screen size</i></span><input type="range" id="s_zoom" min="0.3" max="2.5" step="0.05"><span class="val" id="v_zoom">1.00</span></div>
  <div class="row"><span class="lab">color</span><input type="color" id="s_color" value="#c8deff"></div>
  <div class="row"><div class="segs">
    <button class="seg" id="btnOrig">original</button>
    <button class="seg" id="btnMine">my default</button>
  </div></div>
  <div class="row"><div class="segs"><button class="seg wide" id="savebtn">set as my default</button></div></div>
</div>
<script>
(function(){
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const label=document.getElementById('label');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wrap=document.getElementById('wrap');
  let W,H,frameT=0, lowPower=false, lastDraw=0, aT=0;
  // adjustable look/feel (menu sliders); FACTORY is the built-in default look
  const FACTORY={ brightness:1, glow:1, feather:1, contrast:1, speed:1, bg:1, zoom:1, color:[200,222,255] };
  let brightness=1, glowAmt=1, feather=1, contrast=1, speed=1, bgLevel=1, zoom=1, baseColor=[200,222,255];
  function resize(){ W=innerWidth;H=innerHeight;c.width=W;c.height=H;}
  addEventListener('resize',resize); resize();

  const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+0.5)/16));
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function render(field, t, cols, rows, dotFrac, vignette, glitchAmt){
    ctx.clearRect(0,0,W,H);
    const cell=Math.min(W/cols,H/rows);
    const gw=cols*cell,gh=rows*cell,ox=(W-gw)/2,oy=(H-gh)/2;
    const dot=cell*dotFrac, rr=dot*0.26;
    const breath=0.85+0.15*(0.5+0.5*Math.sin(t/2000));
    const gl=glitchAmt||0, cr0=baseColor[0], cg0=baseColor[1], cb0=baseColor[2];
    const Z=zoom, cxp=W*0.5, cyp=H*0.5;   // in-app zoom: scale dots around screen centre
    for(let row=0;row<rows;row++) for(let col=0;col<cols;col++){
      let v=field(col/cols,row/rows); if(v<=0)continue;
      v*=breath; const th=bayer[row&3][col&3]; if(v<th*0.9)continue;
      // glitch the individual LEDs (jitter / flicker / colour-shift) - not the whole frame
      let jx=0,jy=0, rC=cr0,gC=cg0,bC=cb0;
      if(gl>0){
        if(Math.random()<0.28*gl) jx=(Math.random()*2-1)*cell*1.7*gl;   // horizontal pixel slip
        if(Math.random()<0.10*gl) jy=(Math.random()*2-1)*cell*1.0*gl;
        const f=Math.random();
        if(f<0.30*gl) v*=0.12+Math.random()*0.45;                       // flicker / dropout
        else if(f<0.48*gl) v=Math.min(1,v*1.7+0.25);                    // over-bright spark
        if(Math.random()<0.22*gl){ if(Math.random()<0.5){rC=40;gC=190;bC=255;} else {rC=190;gC=60;bC=255;} }
      }
      // contrast shaping around mid, then base colour + brightness + a white-hot core when driven bright
      let lum=0.5+(v-0.5)*contrast; if(lum<0)lum=0; else if(lum>1)lum=1;
      const k=0.72+0.30*lum, white=Math.max(0,lum-0.60)*Math.max(0,brightness-1)*0.8;
      const R=Math.min(255,rC*k+255*white)|0, G=Math.min(255,gC*k+255*white)|0, B=Math.min(255,bC*k+255*white)|0;
      const a=Math.min(1,(lum*0.90+0.18)*brightness);   // brightness floor + slider -> LEDs pop / go brighter
      ctx.fillStyle='rgba('+R+','+G+','+B+','+a+')';
      const bx=ox+col*cell+cell/2+jx, by=oy+row*cell+cell/2+jy, zd=dot*Z;
      roundRect(cxp+(bx-cxp)*Z-zd/2, cyp+(by-cyp)*Z-zd/2, zd, zd, rr*Z);
    }
    // faint scanlines (neutral black so they never tint the chosen LED colour)
    ctx.fillStyle='rgba(0,0,0,0.18)';
    for(let y=0;y<H;y+=Math.max(2,cell*0.5)) ctx.fillRect(0,y,W,1);
    // additive bloom -> "glow" slider; still runs in smooth mode (single cheaper pass)
    if(glowAmt>0.01){
      // glow slider = intensity (alpha); feather slider = spread (how far the halo bleeds out)
      ctx.globalCompositeOperation='lighter';
      const f=feather;
      ctx.globalAlpha=Math.min(1,0.24*glowAmt); { const s=1+0.012*f; ctx.drawImage(c,-(W*(s-1))/2,-(H*(s-1))/2,W*s,H*s); }
      if(!lowPower){
        ctx.globalAlpha=Math.min(1,0.13*glowAmt); { const s=1+0.030*f; ctx.drawImage(c,-(W*(s-1))/2,-(H*(s-1))/2,W*s,H*s); }
        if(f>1.4){ ctx.globalAlpha=Math.min(1,0.06*glowAmt*(f-1)); const s=1+0.05*f; ctx.drawImage(c,-(W*(s-1))/2,-(H*(s-1))/2,W*s,H*s); }
      }
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
    if(vignette){
      // dark-room falloff: centre pixels keep glowing, outer edges go fully black
      const cxp=W/2, cyp=H/2, inner=Math.min(W,H)*0.30, outer=Math.max(W,H)*0.78;
      const g=ctx.createRadialGradient(cxp,cyp,inner, cxp,cyp,outer);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(0.55,'rgba(0,0,0,0.30)');
      g.addColorStop(0.82,'rgba(0,0,0,0.80)');
      g.addColorStop(1,'rgba(0,0,0,1)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
  }

  /* ================= EYES MODE ================= */
  // normalized eye geometry (0..1 across the field) so grid resolution can change freely
  const EYEX=[0.30,0.70], EYEY=0.5, ERX=0.16, ERY=0.30;
  // NOTE on lidTilt sign: negative => inner corners drop (alert/determined brow);
  // positive => outer corners drop (reads as sad). Keep <= 0 to avoid sad faces.
  const MOODS=[
    { name:'focus',    lidTilt:0.00, topCut:0.00, squint:0.06, curve:-0.04, glow:[210,225,255] },
    { name:'vigilant', lidTilt:-0.22,topCut:0.01, squint:0.10, curve:0.03,  glow:[180,215,255] },
    { name:'wide',     lidTilt:0.00, topCut:-0.14,squint:-0.12,curve:-0.06, glow:[225,238,255] },
    { name:'scan',     lidTilt:-0.08,topCut:0.05, squint:0.30, curve:0.00,  glow:[150,220,255] },
    { name:'chill',    lidTilt:0.00, topCut:0.13, squint:0.10, curve:0.05,  glow:[205,222,255] }
  ];
  let mood=0, gazeX=0,gazeY=0,tgX=0,tgY=0,lid=0,blinking=false;
  function newTarget(){ tgX=(Math.random()*2-1)*0.05; tgY=(Math.random()*2-1)*0.045;
    setTimeout(newTarget,2000+Math.random()*2800); }
  function doBlink(dbl){ if(blinking)return; blinking=true; const s=performance.now(),dur=140;
    (function step(now){ let p=(now-s)/dur; if(p>1)p=1; lid=p<0.5?p*2:2-p*2;
      if(p<1)requestAnimationFrame(step);
      else{lid=0;blinking=false; if(dbl&&Math.random()<0.25)setTimeout(()=>doBlink(false),150);} })(s); }
  function scheduleBlink(){ if(mode==='eyes')doBlink(true); setTimeout(scheduleBlink,3200+Math.random()*3800); }
  // ease the gaze once per frame (not per pixel) so it drifts smoothly
  function stepEyes(){ gazeX+=(tgX-gazeX)*0.09; gazeY+=(tgY-gazeY)*0.09; }
  function eyeField(u,w){
    const m=MOODS[mood];
    // "head" motion: both eyes track together as if a head turns / scans a room
    const yaw   = 0.6*Math.sin(frameT/3600) + 0.25*Math.sin(frameT/1600+1.3);  // ~-0.85..0.85
    const pitch = 0.4*Math.sin(frameT/4700+0.6);
    const faceX = yaw*0.05, faceY = pitch*0.04;
    for(let e=0;e<2;e++){
      const side=e===0?-1:1;                         // -1 left eye, +1 right eye
      // perspective: eye toward the turn foreshortens (narrower), the other widens;
      // inter-eye spacing compresses slightly as the head turns off-centre
      const rx = ERX*(1 - 0.18*yaw*side), ry = ERY*(1 - 0.05*Math.abs(yaw));
      const cx = EYEX[e] + gazeX + faceX - side*Math.abs(yaw)*0.015;
      const cy = EYEY + gazeY + faceY;
      let nx=(u-cx)/rx, ny=(w-cy)/ry, d=nx*nx+ny*ny;
      if(d>1) continue;
      const tiltDir=(EYEX[e]<0.5)?-1:1;
      const lidLine=(-0.15+m.topCut)+(m.lidTilt*tiltDir)*nx+m.curve*(nx*nx-0.4);
      if(ny<lidLine) continue;
      const botLine=1-m.squint; if(ny>botLine) continue;
      const openFrac=1-lid, visibleTop=lidLine+(botLine-lidLine)*(1-openFrac);
      if(ny<visibleTop) continue;
      // spherical shading: steeper rim falloff + a highlight that shifts with the
      // look direction, so the eye reads as a curved ball in a socket, not a flat disc
      const hlx = 0.30*(gazeX/0.05 + yaw), hly = -0.34;
      const hd  = (nx-hlx)*(nx-hlx) + (ny-hly)*(ny-hly);
      const shade = 0.26 + (1-d)*(1-d)*0.62 + Math.max(0,1-hd*1.5)*0.34;
      return Math.max(0,Math.min(1,shade));
    }
    return 0;
  }

  /* ============== CYBERSIGIL MODE ==============
     ringed core + sharp cardinal spikes + branching thorn tendrils,
     morphs shape over time. sharp + technical, LED stipple. */
  // precompute a set of "branches": each is a jagged polyline growing from center.
  let sig=null, sigOld=null, sigNextMorph=0, morphStart=-1e9, morphDur=1300, glStart=0, glEnd=0, glAmt=0;
  function triggerGlitch(now,dur,amt){ if(now+dur>glEnd){ glStart=now; glEnd=now+dur; } if(amt>glAmt) glAmt=amt; }
  function buildSigil(t){
    const branches=[];
    const ring=0.13+Math.random()*0.04;
    // main long jagged tendrils in several directions - cracks growing from core
    const baseDirs=[-Math.PI/2, Math.PI/2, Math.PI*0.14, Math.PI-0.14];
    for(const base of baseDirs){
      const seg=[]; let x=0,y=0, ang=base+(Math.random()*0.4-0.2);
      const steps=9+Math.floor(Math.random()*5);
      for(let i=0;i<steps;i++){
        ang += (Math.random()*2-1)*0.5;
        const len=0.08+Math.random()*0.09;
        x+=Math.cos(ang)*len; y+=Math.sin(ang)*len;
        seg.push([x,y, 1-i/steps]);       // taper thickness
        // frequent small offshoots for finer, denser detail
        if(Math.random()<0.55 && i>0){
          let bx=x,by=y,ba=ang+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.6);
          const bs=2+Math.floor(Math.random()*4); const off=[[x,y,0.5*(1-i/steps)]];
          for(let j=0;j<bs;j++){ ba+=(Math.random()*2-1)*0.45; const bl=0.05+Math.random()*0.06;
            bx+=Math.cos(ba)*bl; by+=Math.sin(ba)*bl; off.push([bx,by,0.42*(1-j/bs)]); }
          branches.push(off);
          // occasional twig off the offshoot -> more branching depth
          if(Math.random()<0.4){
            let tx=bx,ty=by,ta=ba+(Math.random()<0.5?1:-1)*0.9; const tw=[[bx,by,0.28]];
            for(let k=0;k<2;k++){ ta+=(Math.random()*2-1)*0.4; const tl=0.04+Math.random()*0.04;
              tx+=Math.cos(ta)*tl; ty+=Math.sin(ta)*tl; tw.push([tx,ty,0.2]); }
            branches.push(tw);
          }
        }
      }
      branches.push(seg);
    }
    // sharp radial spikes (star burst), straight & tapering
    const spikeCount=7+Math.floor(Math.random()*4);
    for(let s=0;s<spikeCount;s++){
      const a=(s/spikeCount)*Math.PI*2 + (Math.random()*0.25-0.125);
      const len=0.45+Math.random()*0.5;
      const seg=[]; const steps=7;
      for(let i=1;i<=steps;i++){ const r=(i/steps)*len;
        seg.push([Math.cos(a)*r, Math.sin(a)*r, 1-i/steps]); }
      branches.push(seg);
    }
    // fine radial tick marks around the core ring - technical LED detail
    const tickCount=16+Math.floor(Math.random()*8);
    for(let s=0;s<tickCount;s++){
      const a=(s/tickCount)*Math.PI*2;
      const r0=ring-0.02, r1=ring+0.05+Math.random()*0.035;
      branches.push([[Math.cos(a)*r0,Math.sin(a)*r0,0.34],[Math.cos(a)*r1,Math.sin(a)*r1,0.18]]);
    }
    return { branches, ring, rot:Math.random()*Math.PI };
  }
  // schedule morphs once per frame; morph roughly every ~30s (masked by a short glitch)
  function updateSigil(t){
    if(!sig){ sig=buildSigil(t); sigNextMorph=t+7000+Math.random()*6000; return; }
    if(t>sigNextMorph){
      sigOld=sig; sig=buildSigil(t); morphStart=t;
      sigNextMorph=t+26000+Math.random()*9000; triggerGlitch(t,520+Math.random()*360,1.0);
    }
  }
  // sample one sigil shape at normalized (u,w). No side effects -> safe to call twice for a crossfade.
  function sampleSig(sg,u,w,t){
    let x=(u-0.5)/0.30, y=(w-0.5)/0.46;
    const ang=t*0.00019 + sg.rot;          // continuous rotation (a touch faster)
    const ca=Math.cos(ang),sa=Math.sin(ang);
    const px=x*ca-y*sa, py=x*sa+y*ca;
    const r=Math.sqrt(px*px+py*py);
    if(r>1.25) return 0;
    let v=0;
    const ringW=0.038;
    v=Math.max(v, Math.max(0,1-Math.abs(r-sg.ring)/ringW)*0.95);
    const ring2=sg.ring*1.9;
    v=Math.max(v, Math.max(0,1-Math.abs(r-ring2)/(ringW*0.7))*0.4);
    const br=sg.branches;
    for(let b=0;b<br.length;b++){
      const seg=br[b];
      for(let i=1;i<seg.length;i++){
        const ax=seg[i-1][0],ay=seg[i-1][1],bx=seg[i][0],by=seg[i][1], th=seg[i][2];
        const dx=bx-ax,dy=by-ay; const L2=dx*dx+dy*dy||1e-6;
        let uu=((px-ax)*dx+(py-ay)*dy)/L2; uu=uu<0?0:uu>1?1:uu;
        const ex=px-(ax+uu*dx), ey=py-(ay+uu*dy);
        const dist=Math.sqrt(ex*ex+ey*ey);
        const width=0.010+0.038*th;         // taper: thicker near center
        const val=1-dist/width;
        if(val>0){ const vv=val*(0.6+0.4*th); if(vv>v) v=vv; }
      }
    }
    v*=(0.75+0.25*(0.5+0.5*Math.sin(t/1400)));   // pulse (a touch faster)
    return v>1?1:v;
  }
  // crossfade previous -> next shape so a morph flows naturally instead of snapping
  function sigField(u,w,t){
    let v=sampleSig(sig,u,w,t);
    if(t<morphStart+morphDur && sigOld){
      const p=(t-morphStart)/morphDur, e=p*p*(3-2*p);   // smoothstep ease
      v=v*e + sampleSig(sigOld,u,w,t)*(1-e);
    }
    return v;
  }

  /* ================= CAT MODE =================
     Chubby pixel-art cat sprites sampled into the LED field so the silhouette
     actually reads as a cat (ears, head, body, legs, tail). Animation: breathing
     (vertical squash), blink, stretch (horizontal squash) and 2-frame batting. */
  const CAT_SPRITES = {
  sit: [[
  "       ##          ##       ",
  "      ####        ####      ",
  "      #####      #####      ",
  "      ######    ######      ",
  "      ###############       ",
  "     #################      ",
  "    ###################     ",
  "    ###################     ",
  "    ###################     ",
  "    #####o#######o#####     ",
  "    ###################     ",
  "    #########.#########     ",
  "    ###################     ",
  "     #################      ",
  "      #############        ",
  "       ###########         ",
  "       ###########         ",
  "      #############        ",
  "     ###############       ",
  "    #################       ",
  "    ###################     ",
  "   #####################    ",
  "   #####################    ",
  "   #####################  # ",
  "   ##################### ###",
  "   #####################  ##",
  "   ####  #######  ######  # ",
  "   ###    #####    #####    ",
  "    #      ###      ###     ",
  ]],
  loaf: [[
  "                            ",
  "     ###          ###       ",
  "    #####        #####      ",
  "    ######      ######      ",
  "   #######################  ",
  "  #########################  ",
  "  #####o###########o######  ",
  "  #########################  ",
  "  ##########.#.###########   ",
  "  #########################  ",
  " ########################### ",
  " ########################### ",
  " ########################### ",
  "  #########################  ",
  "  #########################  ",
  "   #######################   ",
  "     ###################     ",
  "        #############        ",
  ]],
  sleep: [[
  "                              ",
  "            ###########       ",
  "         #################    ",
  "       #####################  ",
  "   ###########################",
  "  ####o###################### ",
  " ##  o #######################",
  " ############################ ",
  " ############################ ",
  "  ##########################  ",
  "   ########################   ",
  "     ####################     ",
  "        ##############        ",
  ]],
  side: [[
  "    ###                        ",
  "   #####      ###       ###     ",
  "   #####     #####     #####    ",
  "  #######    #####     #####    ",
  "  ###o###########################  ",
  "  #############################   ",
  "  #############################    ",
  "  ##############################   ",
  "   #############################  #",
  "   ###########################  ###",
  "    #######################    ###",
  "       ################         # ",
  ]],
  stretch: [[
  "   ###                         ",
  "  #####                  ###    ",
  "  #o###               #######   ",
  "  ######            ##########   ",
  "   ###########################   ",
  "   ############################  ",
  "   ###########################   ",
  "    ###   ####     ####   ####    ",
  "    ##     ##       ##     ##     ",
  ]],
  play: [[
  "    ###          ###           ",
  "   #####   ###   #####          ",
  "   #####  #####  #####  ###      ",
  "  ####### ##### ############     ",
  "  ##o###################  ##     ",
  "  #####################         ",
  "  #####################         ",
  "   ###################          ",
  "    ####  #####  ####           ",
  "     ##    ###    ##            ",
  ],[
  "   ###              ###        ",
  "  #####  ###    ###  #####      ",
  "  ##### ##### ##### #####       ",
  "  ##########################    ",
  "  ##o#####################  ##  ",
  "  #######################  ###  ",
  "  #####################        ",
  "   ###################         ",
  "    ####  #####  ####          ",
  "     ##    ###    ##           ",
  ]],
  };
  const CAT_NAMES=['sleep','loaf','sit','side','stretch','play'];
  const catW={}; for(const k in CAT_SPRITES) catW[k]=Math.max.apply(null, CAT_SPRITES[k].map(f=>Math.max.apply(null, f.map(r=>r.length))));
  let catAnim=0, gCols=128, gRows=64;
  function catSolid(fr,a,b){ const c=(fr[b]||'')[a]; return !!c && c!==' '; }
  function catField(u,w){
    const name=CAT_NAMES[catAnim], frames=CAT_SPRITES[name], t=frameT;
    const fr = frames.length>1 ? frames[Math.floor(t/180)%frames.length] : frames[0];
    const SW=catW[name], SH=fr.length;
    const breath=Math.sin(t/1100), ampY=(name==='sleep'||name==='loaf')?0.05:0.03;
    const strX = name==='stretch' ? (1+0.06*Math.sin(t/900)) : 1;
    const P=Math.min(gCols/(SW*strX+2), gRows/(SH+2));
    const Px=P*strX, Py=P*(1+ampY*breath);
    const oy=(gRows-SH*P)/2 + (SH*P-SH*Py), ox=(gCols-SW*Px)/2;   // feet fixed; breathe upward
    const px=u*gCols-ox, py=w*gRows-oy;
    if(px<0||py<0) return 0;
    const sx=(px/Px)|0, sy=(py/Py)|0;
    if(sx>=SW||sy>=SH) return 0;
    const ch=(fr[sy]||'')[sx]||' ';
    if(ch===' ') return 0;
    if(ch==='o') return (name!=='sleep' && (t%2800)<130) ? 0.4 : 1.0;   // eye (blinks)
    if(ch==='.') return 0.8;                                            // nose
    // draw only the EDGE bright (line-art cat); interior stays nearly hollow
    if(!catSolid(fr,sx,sy-1)||!catSolid(fr,sx,sy+1)||!catSolid(fr,sx-1,sy)||!catSolid(fr,sx+1,sy)) return 1.0;
    return 0.12;
  }

  /* ================= ROBO EYES MODE =================
     FluxGarage RoboEyes style: two rounded-rectangle eyes with auto-blink,
     idle look-around, and moods via slanted/curved eyelids. */
  const ROBO_NAMES=['default','happy','tired','angry','curious'];
  let roboMood=0, roGx=0,roGy=0,roTx=0,roTy=0,roLid=1,roBlinking=false;
  function roStep(){ roGx+=(roTx-roGx)*0.12; roGy+=(roTy-roGy)*0.12; }
  function roNewTarget(){ const k=roboMood===4?0.10:0.06; roTx=(Math.random()*2-1)*k; roTy=(Math.random()*2-1)*k*0.6;
    setTimeout(roNewTarget, (roboMood===4?800:1500)+Math.random()*2400); }
  function roDoBlink(){ if(roBlinking)return; roBlinking=true; const s=performance.now(),dur=130;
    (function st(n){ let p=(n-s)/dur; if(p>1)p=1; roLid=p<0.5?1-1.84*p:0.08+1.84*(p-0.5);
      if(p<1)requestAnimationFrame(st); else{roLid=1;roBlinking=false;} })(s); }
  function roBlinkLoop(){ if(mode==='robo') roDoBlink(); setTimeout(roBlinkLoop, 2600+Math.random()*3600); }
  function rbox(nx,ny,rr){ const qx=Math.abs(nx)-(1-rr), qy=Math.abs(ny)-(1-rr);
    const ax=qx>0?qx:0, ay=qy>0?qy:0; return Math.sqrt(ax*ax+ay*ay)+Math.min(Math.max(qx,qy),0)-rr; }
  function roboField(u,w){
    const cx=0.5, cy=0.5, sep=0.185, hw=0.13, hh=0.17, rr=0.42, m=ROBO_NAMES[roboMood];
    for(let i=0;i<2;i++){
      const e=i===0?-1:1;
      let ehw=hw;
      if(m==='curious'){ const s=roGx>0?1:roGx<0?-1:0; ehw=hw*(1+0.22*Math.max(0,e*s)*Math.min(1,Math.abs(roGx)/0.08)); }
      const exC=cx+e*sep+roGx, eyC=cy+roGy;
      const nx=(u-exC)/ehw, ny=(w-eyC)/(hh*roLid);
      if(nx< -1.2||nx>1.2||ny< -1.2||ny>1.2) continue;
      if(rbox(nx,ny,rr)>0) continue;
      const inner=nx*(-e), outer=nx*e;   // eyelids: up = negative ny
      let topL=-1.3, botL=1.3;
      if(m==='angry') topL=-0.95+1.5*inner;
      else if(m==='tired') topL=-0.95+1.5*outer;
      else if(m==='happy') botL=0.9*nx*nx-0.15;
      if(ny<topL||ny>botL) continue;
      return 1.0;
    }
    return 0;
  }

  /* ================= MODE MGMT ================= */
  let mode='eyes';
  const SIG_GLOW=[195,218,255];
  function loop(now){
    const t=now||0;
    // smooth mode: cap to ~33fps for a steady frame time on weak GPUs (motion is time-based)
    if(lowPower && t-lastDraw<30){ requestAnimationFrame(loop); return; }
    const dt = lastDraw ? Math.min(100, t-lastDraw) : 16;   // clamp so tab-switches don't jump
    lastDraw=t; aT += dt*speed; frameT=aT;                   // aT = speed-scaled animation clock
    let gA=0;
    if(aT<glEnd){ gA=glAmt*Math.max(0,1-(aT-glStart)/(glEnd-glStart)); } else glAmt=0;
    if(mode==='eyes'){
      stepEyes();
      const eC=lowPower?96:120, eR=lowPower?40:50;
      render(eyeField, aT, eC, eR, 0.68, true, 0);
    } else if(mode==='robo'){
      roStep();
      const eC=lowPower?96:120, eR=lowPower?40:50;
      render(roboField, aT, eC, eR, 0.72, true, 0);
    } else if(mode==='cat'){
      const cC=lowPower?100:128, cR=lowPower?50:64; gCols=cC; gRows=cR;
      render(catField, aT, cC, cR, 0.72, true, 0);
    } else {
      updateSigil(aT);
      const sC=lowPower?108:144, sR=lowPower?46:60;
      render((u,w)=>sigField(u,w,aT), aT, sC, sR, 0.578, true, gA);
    }
    requestAnimationFrame(loop);
  }
  function flash(txt){ label.textContent=txt; label.classList.add('show');
    clearTimeout(label._t); label._t=setTimeout(()=>label.classList.remove('show'),900); }

  /* ---- central setters so keys and the menu stay in sync (mode is menu-bound now) ---- */
  function setMode(m){ if(m!==mode){ mode=m; if(m==='eyes')doBlink(false); flash(m); } updateUI(); }
  function setMood(i){ mood=(i%MOODS.length+MOODS.length)%MOODS.length; flash(MOODS[mood].name);
    if(mode==='eyes')doBlink(false); updateUI(); }
  function setCat(i){ catAnim=(i%CAT_NAMES.length+CAT_NAMES.length)%CAT_NAMES.length; flash(CAT_NAMES[catAnim]); updateUI(); }
  function setRobo(i){ roboMood=(i%ROBO_NAMES.length+ROBO_NAMES.length)%ROBO_NAMES.length; flash(ROBO_NAMES[roboMood]); updateUI(); }
  function setPerf(on){ lowPower=!!on; flash(on?'smooth on':'smooth off'); updateUI(); }
  function updateUI(){
    document.querySelectorAll('#panel [data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
    document.querySelectorAll('#panel [data-mood]').forEach(b=>b.classList.toggle('on', +b.dataset.mood===mood));
    document.querySelectorAll('#panel [data-cat]').forEach(b=>b.classList.toggle('on', +b.dataset.cat===catAnim));
    document.querySelectorAll('#panel [data-robo]').forEach(b=>b.classList.toggle('on', +b.dataset.robo===roboMood));
    const p=document.getElementById('perf'); p.textContent=lowPower?'ON':'OFF'; p.classList.toggle('on',lowPower);
    // show only the sub-selection row that belongs to the current character
    document.getElementById('moodrow').style.display  = mode==='eyes'?'':'none';
    document.getElementById('blinkrow').style.display = mode==='eyes'?'':'none';
    document.getElementById('roborow').style.display  = mode==='robo'?'':'none';
    document.getElementById('catrow').style.display   = mode==='cat' ?'':'none';
  }
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowleft') setMode('sigil');
    else if(k==='arrowright') setMode('eyes');
    else if(k==='arrowup'||k==='arrowdown'){ e.preventDefault(); setMode('cat'); }
    else if(e.key===' '){ e.preventDefault(); if(mode==='eyes') setMood(mood+1); else if(mode==='cat') setCat(catAnim+1); else if(mode==='robo') setRobo(roboMood+1); }
    else if(k==='s') setPerf(!lowPower);
  });

  /* ---- hidden settings tab: tap top-right to open; tap anywhere outside to close ---- */
  const panel=document.getElementById('panel');
  function togglePanel(show){ const s = show===undefined ? panel.classList.contains('hidden') : show;
    panel.classList.toggle('hidden', !s); }
  document.getElementById('settingshit').addEventListener('pointerdown',e=>{ e.stopPropagation(); togglePanel(); });
  panel.addEventListener('pointerdown',e=>e.stopPropagation());
  // tapping the animation (outside the panel) just closes the menu - no more mode switching by tap
  document.getElementById('wrap').addEventListener('pointerdown',()=>{ if(!panel.classList.contains('hidden')) togglePanel(false); });
  panel.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('pointerdown',()=>setMode(b.dataset.mode)));
  panel.querySelectorAll('[data-mood]').forEach(b=>b.addEventListener('pointerdown',()=>setMood(+b.dataset.mood)));
  panel.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('pointerdown',()=>setCat(+b.dataset.cat)));
  panel.querySelectorAll('[data-robo]').forEach(b=>b.addEventListener('pointerdown',()=>setRobo(+b.dataset.robo)));
  document.getElementById('perf').addEventListener('pointerdown',()=>setPerf(!lowPower));
  document.getElementById('blinkbtn').addEventListener('pointerdown',()=>{ setMode('eyes'); doBlink(true); });
  document.getElementById('closebtn').addEventListener('pointerdown',()=>togglePanel(false));

  /* ---- look/feel sliders, LED colour picker, and defaults ---- */
  const el=id=>document.getElementById(id);
  const sB=el('s_bright'), sG=el('s_glow'), sF=el('s_feather'), sC=el('s_contrast'), sS=el('s_speed'), sBg=el('s_bg'), sZ=el('s_zoom'), sCol=el('s_color');
  const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const rgb2hex=c=>'#'+c.map(x=>('0'+Math.round(x).toString(16)).slice(-2)).join('');
  // ambient background + menu accent follow the LED colour; "bg" scales it (0 = pure black, higher = more lit)
  function applyBg(){
    const [r,g,b]=baseColor, m=bgLevel;
    const c1=`rgb(${r*0.10*m|0},${g*0.11*m|0},${b*0.12*m|0})`, c0=`rgb(${r*0.045*m|0},${g*0.05*m|0},${b*0.06*m|0})`;
    wrap.style.background=`radial-gradient(ellipse 75% 65% at 50% 50%, ${c1} 0%, ${c0} 72%)`;
    document.body.style.background=c0;
    panel.style.setProperty('--accent', `rgb(${baseColor.map(x=>Math.round(x)).join(',')})`);
  }
  function syncInputs(){
    sB.value=brightness; sG.value=glowAmt; sF.value=feather; sC.value=contrast; sS.value=speed; sBg.value=bgLevel; sZ.value=zoom; sCol.value=rgb2hex(baseColor);
    el('v_bright').textContent=(+brightness).toFixed(2); el('v_glow').textContent=(+glowAmt).toFixed(2);
    el('v_feather').textContent=(+feather).toFixed(2); el('v_contrast').textContent=(+contrast).toFixed(2);
    el('v_speed').textContent=(+speed).toFixed(2); el('v_bg').textContent=(+bgLevel).toFixed(2);
    el('v_zoom').textContent=(+zoom).toFixed(2);
  }
  const currentSettings=()=>({ brightness, glow:glowAmt, feather, contrast, speed, bg:bgLevel, zoom, color:baseColor.slice() });
  function applySettings(s){
    brightness=+s.brightness; glowAmt=+s.glow; feather=(s.feather==null?1:+s.feather);
    contrast=+s.contrast; speed=+s.speed; bgLevel=(s.bg==null?1:+s.bg); zoom=(s.zoom==null?1:+s.zoom); baseColor=s.color.slice();
    syncInputs(); applyBg(); updateUI();
  }
  function loadDefault(){ try{ const s=JSON.parse(localStorage.getItem('anim_default')); if(s&&s.color) return s; }catch(e){} return null; }
  function updateDefaultBtns(){ el('btnMine').classList.toggle('dis', !loadDefault()); }
  sB.addEventListener('input',()=>{ brightness=+sB.value; el('v_bright').textContent=brightness.toFixed(2); });
  sG.addEventListener('input',()=>{ glowAmt=+sG.value; el('v_glow').textContent=glowAmt.toFixed(2); });
  sF.addEventListener('input',()=>{ feather=+sF.value; el('v_feather').textContent=feather.toFixed(2); });
  sC.addEventListener('input',()=>{ contrast=+sC.value; el('v_contrast').textContent=contrast.toFixed(2); });
  sS.addEventListener('input',()=>{ speed=+sS.value; el('v_speed').textContent=speed.toFixed(2); });
  sBg.addEventListener('input',()=>{ bgLevel=+sBg.value; el('v_bg').textContent=bgLevel.toFixed(2); applyBg(); });
  sZ.addEventListener('input',()=>{ zoom=+sZ.value; el('v_zoom').textContent=zoom.toFixed(2); });
  sCol.addEventListener('input',()=>{ baseColor=hex2rgb(sCol.value); applyBg(); });
  el('btnOrig').addEventListener('pointerdown',()=>{ applySettings(FACTORY); flash('original'); });
  el('btnMine').addEventListener('pointerdown',()=>{ const d=loadDefault(); if(d){ applySettings(d); flash('my default'); } });
  el('savebtn').addEventListener('pointerdown',()=>{ try{ localStorage.setItem('anim_default', JSON.stringify(currentSettings())); }catch(e){} updateDefaultBtns(); flash('default saved'); });

  applySettings(loadDefault()||FACTORY);
  updateDefaultBtns();
  if(!reduce){ newTarget(); setTimeout(scheduleBlink,1600); roNewTarget(); setTimeout(roBlinkLoop,2200); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
