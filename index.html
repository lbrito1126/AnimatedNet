<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>eyes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#04050a; overflow:hidden;
    cursor:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 75% 65% at 50% 50%, #0a0d16 0%, #04050a 72%); }
  canvas { width:100%; height:100%; image-rendering:pixelated; }
  #moodhit { position:fixed; right:0; bottom:0; width:20vw; height:20vh; z-index:5; }
  #label { position:fixed; left:50%; bottom:5%; transform:translateX(-50%);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:2.4vh; letter-spacing:.35em;
    color:rgba(180,205,255,0); text-transform:uppercase; transition:color .25s; pointer-events:none;
    text-shadow:0 0 12px rgba(120,160,255,.6); }
  #label.show { color:rgba(180,205,255,.75); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="label"></div>
<div id="moodhit"></div>
<script>
(function(){
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const label=document.getElementById('label');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COLS=120, ROWS=50;          // eyes grid
  const SCOLS=144, SROWS=60;        // sigil grid: ~20% denser than eyes
  let W,H,frameT=0;
  function resize(){ W=innerWidth;H=innerHeight;c.width=W;c.height=H;}
  addEventListener('resize',resize); resize();

  const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+0.5)/16));
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }

  function render(field, glow, t, cols, rows, dotFrac, vignette, glitchAmt){
    ctx.clearRect(0,0,W,H);
    const cell=Math.min(W/cols,H/rows);
    const gw=cols*cell,gh=rows*cell,ox=(W-gw)/2,oy=(H-gh)/2;
    const dot=cell*dotFrac, rr=dot*0.26;
    const breath=0.85+0.15*(0.5+0.5*Math.sin(t/2500));
    for(let row=0;row<rows;row++) for(let col=0;col<cols;col++){
      let v=field(col,row); if(v<=0)continue;
      v*=breath; const th=bayer[row&3][col&3]; if(v<th*0.9)continue;
      const a=Math.min(1,v);
      ctx.fillStyle=`rgba(${Math.floor(glow[0]*(0.8+0.2*v))},${Math.floor(glow[1]*(0.85+0.15*v))},255,${a})`;
      roundRect(ox+col*cell+(cell-dot)/2, oy+row*cell+(cell-dot)/2, dot,dot,rr);
    }
    ctx.fillStyle='rgba(0,0,10,0.18)';
    for(let y=0;y<H;y+=Math.max(2,cell*0.5)) ctx.fillRect(0,y,W,1);
    if(glitchAmt>0) applyGlitch(glitchAmt);
    if(vignette){
      // dark-room falloff: centre pixels keep glowing, outer edges go fully black
      const cxp=W/2, cyp=H/2, inner=Math.min(W,H)*0.30, outer=Math.max(W,H)*0.78;
      const g=ctx.createRadialGradient(cxp,cyp,inner, cxp,cyp,outer);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(0.55,'rgba(0,0,0,0.30)');
      g.addColorStop(0.82,'rgba(0,0,0,0.80)');
      g.addColorStop(1,'rgba(0,0,0,1)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
  }
  // glitch post-process: horizontal slice tearing + colour fringe; amt ~0..1.6
  function applyGlitch(amt){
    const bands=5+Math.floor(amt*7);
    for(let i=0;i<bands;i++){
      if(Math.random()>0.6) continue;
      const by=Math.random()*H, bh=H*(0.012+Math.random()*0.05);
      const dx=(Math.random()*2-1)*30*amt;
      ctx.drawImage(c, 0,by,W,bh, dx,by,W,bh);
    }
    if(Math.random()<0.55*amt){
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=`rgba(${Math.random()<0.5?'0,170,255':'150,60,255'},${0.05+0.09*amt})`;
      ctx.fillRect(0,Math.random()*H,W,H*(0.02+0.04*Math.random()));
      ctx.globalCompositeOperation='source-over';
    }
    if(Math.random()<0.25*amt){ ctx.fillStyle=`rgba(0,0,4,${0.12*amt})`; ctx.fillRect(0,0,W,H); }
  }

  /* ================= EYES MODE ================= */
  const eyeCX=[COLS*0.30,COLS*0.70], eyeCY=ROWS*0.5, eyeRX=COLS*0.16, eyeRY=ROWS*0.30;
  // NOTE on lidTilt sign: negative => inner corners drop (alert/determined brow);
  // positive => outer corners drop (reads as sad). Keep <= 0 to avoid sad faces.
  const MOODS=[
    { name:'focus',    lidTilt:0.00, topCut:0.00, squint:0.06, curve:-0.04, glow:[210,225,255] },
    { name:'vigilant', lidTilt:-0.22,topCut:0.01, squint:0.10, curve:0.03,  glow:[180,215,255] },
    { name:'wide',     lidTilt:0.00, topCut:-0.14,squint:-0.12,curve:-0.06, glow:[225,238,255] },
    { name:'scan',     lidTilt:-0.08,topCut:0.05, squint:0.30, curve:0.00,  glow:[150,220,255] },
    { name:'chill',    lidTilt:0.00, topCut:0.13, squint:0.10, curve:0.05,  glow:[205,222,255] }
  ];
  let mood=0, gazeX=0,gazeY=0,tgX=0,tgY=0,lid=0,blinking=false;
  function newTarget(){ tgX=(Math.random()*2-1)*(COLS*0.05); tgY=(Math.random()*2-1)*(ROWS*0.045);
    setTimeout(newTarget,2600+Math.random()*3600); }
  function doBlink(dbl){ if(blinking)return; blinking=true; const s=performance.now(),dur=150;
    (function step(now){ let p=(now-s)/dur; if(p>1)p=1; lid=p<0.5?p*2:2-p*2;
      if(p<1)requestAnimationFrame(step);
      else{lid=0;blinking=false; if(dbl&&Math.random()<0.25)setTimeout(()=>doBlink(false),150);} })(s); }
  function scheduleBlink(){ if(mode==='eyes')doBlink(true); setTimeout(scheduleBlink,3400+Math.random()*4200); }
  function eyeField(col,row){
    const m=MOODS[mood];
    gazeX+=(tgX-gazeX)*0.05; gazeY+=(tgY-gazeY)*0.05;
    // slow "head" motion: both eyes track together as if a head turns / scans a room
    const yaw   = 0.6*Math.sin(frameT/4300) + 0.25*Math.sin(frameT/1900+1.3);  // ~-0.85..0.85
    const pitch = 0.4*Math.sin(frameT/5600+0.6);
    const faceX = yaw*(COLS*0.05), faceY = pitch*(ROWS*0.04);
    for(let e=0;e<2;e++){
      const side=e===0?-1:1;                         // -1 left eye, +1 right eye
      // perspective: eye toward the turn foreshortens (narrower), the other widens;
      // inter-eye spacing compresses slightly as the head turns off-centre
      const rx = eyeRX*(1 - 0.18*yaw*side), ry = eyeRY*(1 - 0.05*Math.abs(yaw));
      const cx = eyeCX[e] + gazeX + faceX - side*Math.abs(yaw)*(COLS*0.015);
      const cy = eyeCY + gazeY + faceY;
      let nx=(col-cx)/rx, ny=(row-cy)/ry, d=nx*nx+ny*ny;
      if(d>1) continue;
      const tiltDir=(eyeCX[e]<COLS/2)?-1:1;
      const lidLine=(-0.15+m.topCut)+(m.lidTilt*tiltDir)*nx+m.curve*(nx*nx-0.4);
      if(ny<lidLine) continue;
      const botLine=1-m.squint; if(ny>botLine) continue;
      const openFrac=1-lid, visibleTop=lidLine+(botLine-lidLine)*(1-openFrac);
      if(ny<visibleTop) continue;
      // spherical shading: steeper rim falloff + a highlight that shifts with the
      // look direction, so the eye reads as a curved ball in a socket, not a flat disc
      const hlx = 0.30*(gazeX/(COLS*0.05) + yaw), hly = -0.34;
      const hd  = (nx-hlx)*(nx-hlx) + (ny-hly)*(ny-hly);
      const shade = 0.26 + (1-d)*(1-d)*0.62 + Math.max(0,1-hd*1.5)*0.34;
      return Math.max(0,Math.min(1,shade));
    }
    return 0;
  }

  /* ============== CYBERSIGIL MODE ==============
     ringed core + sharp cardinal spikes + branching thorn tendrils,
     morphs shape over time. sharp + technical, LED stipple. */
  // precompute a set of "branches": each is a jagged polyline growing from center.
  let sig=null, sigNextMorph=0, glStart=0, glEnd=0, glAmt=0, bigGlitchNext=0;
  function triggerGlitch(now,dur,amt){ if(now+dur>glEnd){ glStart=now; glEnd=now+dur; } if(amt>glAmt) glAmt=amt; }
  function buildSigil(t){
    const branches=[];
    const ring=0.13+Math.random()*0.04;
    // main long jagged tendrils in several directions - cracks growing from core
    const baseDirs=[-Math.PI/2, Math.PI/2, Math.PI*0.14, Math.PI-0.14];
    for(const base of baseDirs){
      const seg=[]; let x=0,y=0, ang=base+(Math.random()*0.4-0.2);
      const steps=9+Math.floor(Math.random()*5);
      for(let i=0;i<steps;i++){
        ang += (Math.random()*2-1)*0.5;
        const len=0.08+Math.random()*0.09;
        x+=Math.cos(ang)*len; y+=Math.sin(ang)*len;
        seg.push([x,y, 1-i/steps]);       // taper thickness
        // frequent small offshoots for finer, denser detail
        if(Math.random()<0.55 && i>0){
          let bx=x,by=y,ba=ang+(Math.random()<0.5?1:-1)*(0.5+Math.random()*0.6);
          const bs=2+Math.floor(Math.random()*4); const off=[[x,y,0.5*(1-i/steps)]];
          for(let j=0;j<bs;j++){ ba+=(Math.random()*2-1)*0.45; const bl=0.05+Math.random()*0.06;
            bx+=Math.cos(ba)*bl; by+=Math.sin(ba)*bl; off.push([bx,by,0.42*(1-j/bs)]); }
          branches.push(off);
          // occasional twig off the offshoot -> more branching depth
          if(Math.random()<0.4){
            let tx=bx,ty=by,ta=ba+(Math.random()<0.5?1:-1)*0.9; const tw=[[bx,by,0.28]];
            for(let k=0;k<2;k++){ ta+=(Math.random()*2-1)*0.4; const tl=0.04+Math.random()*0.04;
              tx+=Math.cos(ta)*tl; ty+=Math.sin(ta)*tl; tw.push([tx,ty,0.2]); }
            branches.push(tw);
          }
        }
      }
      branches.push(seg);
    }
    // sharp radial spikes (star burst), straight & tapering
    const spikeCount=7+Math.floor(Math.random()*4);
    for(let s=0;s<spikeCount;s++){
      const a=(s/spikeCount)*Math.PI*2 + (Math.random()*0.25-0.125);
      const len=0.45+Math.random()*0.5;
      const seg=[]; const steps=7;
      for(let i=1;i<=steps;i++){ const r=(i/steps)*len;
        seg.push([Math.cos(a)*r, Math.sin(a)*r, 1-i/steps]); }
      branches.push(seg);
    }
    // fine radial tick marks around the core ring - technical LED detail
    const tickCount=16+Math.floor(Math.random()*8);
    for(let s=0;s<tickCount;s++){
      const a=(s/tickCount)*Math.PI*2;
      const r0=ring-0.02, r1=ring+0.05+Math.random()*0.035;
      branches.push([[Math.cos(a)*r0,Math.sin(a)*r0,0.34],[Math.cos(a)*r1,Math.sin(a)*r1,0.18]]);
    }
    return { branches, ring, rot:Math.random()*Math.PI };
  }
  function sigilField(col,row,t){
    // slightly faster morph cadence; the morph is masked by a glitch (not a hard snap)
    if(!sig || t>sigNextMorph){ sig=buildSigil(t); sigNextMorph=t+3000+Math.random()*2500; triggerGlitch(t,240+Math.random()*220,1.0); }
    const cx=SCOLS*0.5, cy=SROWS*0.5;
    // normalize to same aspect as grid feel
    let x=(col-cx)/(SCOLS*0.30), y=(row-cy)/(SROWS*0.46);
    const ang=t*0.00014 + sig.rot;         // slow overall rotation (a touch faster)
    const ca=Math.cos(ang),sa=Math.sin(ang);
    let rx=x*ca-y*sa, ry=x*sa+y*ca;
    const r=Math.sqrt(rx*rx+ry*ry);
    if(r>1.25) return 0;
    let v=0;
    // --- central ring (bright open circle) ---
    const ringW=0.038;
    v=Math.max(v, Math.max(0,1-Math.abs(r-sig.ring)/ringW)*0.95);
    // faint secondary outer ring for layered technical detail
    const ring2=sig.ring*1.9;
    v=Math.max(v, Math.max(0,1-Math.abs(r-ring2)/(ringW*0.7))*0.4);
    // hollow center stays dark (ref has open middle) -> nothing inside ring
    // --- branches: distance to each polyline segment ---
    const px=rx, py=ry;
    for(const seg of sig.branches){
      for(let i=1;i<seg.length;i++){
        const ax=seg[i-1][0],ay=seg[i-1][1],bx=seg[i][0],by=seg[i][1];
        const th=seg[i][2];
        // dist from point to segment
        const dx=bx-ax,dy=by-ay; const L2=dx*dx+dy*dy||1e-6;
        let u=((px-ax)*dx+(py-ay)*dy)/L2; u=Math.max(0,Math.min(1,u));
        const qx=ax+u*dx, qy=ay+u*dy;
        const dist=Math.hypot(px-qx,py-qy);
        const width=0.010+0.038*th;         // taper: thicker near center
        const val=Math.max(0,1-dist/width);
        if(val>v) v=val*(0.6+0.4*th);
      }
    }
    // pulse
    v*=(0.75+0.25*(0.5+0.5*Math.sin(t/1700)));
    return Math.min(1,v);
  }

  /* ================= MODE MGMT ================= */
  let mode='eyes';
  const SIG_GLOW=[195,218,255];
  function loop(now){
    const t=now||0; frameT=t;
    // stronger glitch burst at a random 15-30s cadence (also reshuffles the sigil)
    if(bigGlitchNext===0) bigGlitchNext=t+15000+Math.random()*15000;
    if(mode==='sigil' && t>bigGlitchNext){ sig=buildSigil(t); triggerGlitch(t,420+Math.random()*260,1.6); bigGlitchNext=t+15000+Math.random()*15000; }
    let gA=0;
    if(t<glEnd){ gA=glAmt*Math.max(0,1-(t-glStart)/(glEnd-glStart)); } else glAmt=0;
    if(mode==='eyes') render(eyeField, MOODS[mood].glow, t, COLS, ROWS, 0.68, true, 0);
    else render((col,row)=>sigilField(col,row,t), SIG_GLOW, t, SCOLS, SROWS, 0.578, true, gA);
    requestAnimationFrame(loop);
  }
  function flash(txt){ label.textContent=txt; label.classList.add('show');
    clearTimeout(label._t); label._t=setTimeout(()=>label.classList.remove('show'),900); }

  document.getElementById('moodhit').addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(mode==='eyes'){ mood=(mood+1)%MOODS.length; flash(MOODS[mood].name); doBlink(false); }
  });
  document.getElementById('wrap').addEventListener('pointerdown',e=>{
    const x=e.clientX/W;
    if(x<0.5){ if(mode!=='sigil'){mode='sigil'; sig=null; flash('sigil');} }
    else { if(mode!=='eyes'){mode='eyes'; flash('eyes'); doBlink(false);} else doBlink(true); }
  });
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){mode='sigil';sig=null;flash('sigil');}
    else if(e.key==='ArrowRight'){mode='eyes';flash('eyes');}
    else if(e.key===' '){e.preventDefault(); if(mode==='eyes'){mood=(mood+1)%MOODS.length;flash(MOODS[mood].name);doBlink(false);}}
  });

  if(!reduce){ newTarget(); setTimeout(scheduleBlink,1600); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
